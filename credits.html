<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E1041B">
  <title>크레딧 | 신흥시장에서 해방촌까지 with 코카-콜라</title>

  <!-- 링크 공유 미리보기 (카톡 등) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="신흥시장에서 해방촌까지 with 코카-콜라">
  <meta property="og:description" content="신흥시장에서 해방촌까지 with 코카-콜라">

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 디자인 기준(가로 390px)의 1px. 메인 페이지와 같은 기준 */
      --u: calc(min(100vw, 540px) / 390);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--red);
    }

    body {
      color: var(--bg);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    p,
    h1,
    dl,
    dt,
    dd {
      margin: 0;
    }

    /* 화면 높이를 꽉 채우고, 아래 내용은 항상 맨 아래 */
    .page {
      display: flex;
      flex-direction: column;
      width: min(100vw, 540px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding:
        calc(var(--u) * 22 + env(safe-area-inset-top, 0px))
        calc(var(--u) * 24)
        calc(var(--u) * 36 + env(safe-area-inset-bottom, 0px));
    }





    /* 크레딧 */
    /* 가운데 마무리 글 */
    .closing {
      margin: auto 0;
      padding: calc(var(--u) * 40) 0;
    }

    .end {
      margin: 0;
      font-size: calc(var(--u) * 26);
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: -0.05em;
    }

    .note {
      margin-top: calc(var(--u) * 18);
      font-size: calc(var(--u) * 15);
      font-weight: 500;
      line-height: 1.7;
      letter-spacing: -0.03em;
    }

    /* 크레딧 */
    .credits {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: calc(var(--u) * 16);
      row-gap: calc(var(--u) * 10);
      margin-top: calc(var(--u) * 40);
      padding-top: calc(var(--u) * 18);
      border-top: 1px solid rgba(243, 242, 236, 0.4);
    }

    .credits dt {
      font-size: calc(var(--u) * 12);
      line-height: 1.6;
      letter-spacing: -0.02em;
      opacity: 0.7;
    }

    .credits dd {
      font-size: calc(var(--u) * 14);
      line-height: 1.45;
      letter-spacing: -0.03em;
    }

    /* 처음으로 버튼 */
    .home {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: calc(var(--u) * 32);
      padding: calc(var(--u) * 17) calc(var(--u) * 20);
      background: var(--bg);
      color: var(--red);
      font-size: calc(var(--u) * 17);
      letter-spacing: -0.03em;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .home:active {
      transform: scale(0.98);
    }

    .home .arrow {
      transition: transform 0.2s ease;
    }

    @media (hover: hover) {
      .home:hover .arrow {
        transform: translateX(calc(var(--u) * -6));
      }
    }

    .home:focus-visible,
    .back:focus-visible {
      outline: 2px solid var(--bg);
      outline-offset: 4px;
    }

    /* 해방촌 지도로 돌아가기 (작게) */
    .back {
      align-self: center;
      margin-top: calc(var(--u) * 14);
      padding: calc(var(--u) * 6);
      color: inherit;
      font-size: calc(var(--u) * 13);
      letter-spacing: -0.02em;
      text-decoration: underline;
      text-underline-offset: 3px;
      opacity: 0.8;
      -webkit-tap-highlight-color: transparent;
    }

    /* 두 번째 링크는 바로 아래에 붙여서 */
    .back + .back {
      margin-top: calc(var(--u) * 2);
    }

    .copy {
      margin-top: calc(var(--u) * 22);
      text-align: center;
      font-size: calc(var(--u) * 11);
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0.6;
    }

    /* 들어올 때 글자가 아래에서 살짝 떠오르는 효과 */
    .rise {
      animation: rise 0.8s cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: calc(var(--d, 0) * 1s);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(calc(var(--u) * 18)); }
      to { opacity: 1; transform: none; }
    }

    /* 움직임 줄이기 설정을 켠 사람에게는 효과 없이 바로 보여줌 */
    @media (prefers-reduced-motion: reduce) {
      .rise {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="closing">
      <h1 class="end rise" style="--d:0.05">

      <p class="note rise" style="--d:0.2">
        코카-콜라와 지역 상인들이<br>
        함께 만들어갈 다양한 이야기들을<br>
        앞으로도 기대해 주세요!
      </p>

      <dl class="credits rise" style="--d:0.35">
        <dt>주최·주관</dt>
        <dd>한국 코카-콜라</dd>
        <dt>협력</dt>
        <dd>신흥시장 상인회 · 해방촌 상인회</dd>
      </dl>
    </div>

    <a class="home rise" style="--d:0.5" href="index.html">
      <span>처음으로</span>
      <span class="arrow" aria-hidden="true">↺</span>
    </a>

    <a class="back rise" style="--d:0.6" href="map-sinheung.html">신흥시장 지도로 돌아가기</a>
    <a class="back rise" style="--d:0.65" href="map-haebangchon.html">해방촌 지도로 돌아가기</a>

    <p class="copy rise" style="--d:0.7">© 2026 The Coca-Cola Company. All rights reserved.</p>

  </main>

  <!-- 오른쪽으로 밀면 마지막 가게(벽화)로 돌아감 -->
  <script src="shops/swipe.js" data-prev="shops-haebangchon/shop-09.html"></script>
</body>
</html>
