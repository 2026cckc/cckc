<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E1041B">
  <title>크레딧 | 신흥시장에서 해방촌까지 with 코카-콜라</title>

  <!-- 링크 공유 미리보기 (카톡 등) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="신흥시장에서 해방촌까지 with 코카-콜라">
  <meta property="og:description" content="신흥시장에서 해방촌까지, 한 골목에서 2년 with 코카-콜라">
  <meta property="og:image" content="https://2026cckc.github.io/cckc/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 디자인 기준(가로 390px)의 1px. 메인 페이지와 같은 기준 */
      --u: calc(min(100vw, 540px) / 390);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--red);
    }

    body {
      color: var(--bg);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    p,
    h1,
    dl,
    dt,
    dd {
      margin: 0;
    }

    /* 화면 높이를 꽉 채우고, 아래 내용은 항상 맨 아래 */
    .page {
      display: flex;
      flex-direction: column;
      width: min(100vw, 540px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding:
        calc(var(--u) * 22 + env(safe-area-inset-top, 0px))
        calc(var(--u) * 24)
        calc(var(--u) * 36 + env(safe-area-inset-bottom, 0px));
    }

    /* 오른쪽 위 작은 글씨 */
    .brand {
      text-align: right;
      font-size: calc(var(--u) * 12);
      letter-spacing: -0.02em;
    }

    /* 마무리 제목 (메인 표지와 같은 문구) */
    .title {
      margin-top: calc(var(--u) * 54);
      font-size: calc(var(--u) * 40);
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: -0.055em;
    }

    .with {
      display: inline-block;
      margin-top: calc(var(--u) * 16);
      padding: calc(var(--u) * 4) calc(var(--u) * 8);
      background: var(--bg);
      color: var(--red);
      font-size: calc(var(--u) * 15);
      letter-spacing: -0.03em;
    }

    /* 길처럼 이어지는 선 */
    .path {
      flex: 1;
      width: calc(var(--u) * 3);
      min-height: calc(var(--u) * 50);
      margin: calc(var(--u) * 28) 0 calc(var(--u) * 28) calc(var(--u) * 2);
      background: var(--bg);
      transform-origin: top;
      animation: draw 1.2s 0.4s cubic-bezier(.6, 0, .2, 1) both;
    }

    /* 크레딧 */
    .credits {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: calc(var(--u) * 16);
      row-gap: calc(var(--u) * 12);
      padding-top: calc(var(--u) * 18);
      border-top: 1px solid rgba(243, 242, 236, 0.4);
    }

    .credits dt {
      font-size: calc(var(--u) * 12);
      line-height: 1.6;
      letter-spacing: -0.02em;
      opacity: 0.7;
    }

    .credits dd {
      font-size: calc(var(--u) * 15);
      line-height: 1.45;
      letter-spacing: -0.03em;
    }

    /* 처음으로 버튼 */
    .home {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: calc(var(--u) * 32);
      padding: calc(var(--u) * 17) calc(var(--u) * 20);
      background: var(--bg);
      color: var(--red);
      font-size: calc(var(--u) * 17);
      letter-spacing: -0.03em;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .home:active {
      transform: scale(0.98);
    }

    .home .arrow {
      transition: transform 0.2s ease;
    }

    @media (hover: hover) {
      .home:hover .arrow {
        transform: translateX(calc(var(--u) * -6));
      }
    }

    .home:focus-visible,
    .back:focus-visible {
      outline: 2px solid var(--bg);
      outline-offset: 4px;
    }

    /* 해방촌 지도로 돌아가기 (작게) */
    .back {
      align-self: center;
      margin-top: calc(var(--u) * 14);
      padding: calc(var(--u) * 6);
      color: inherit;
      font-size: calc(var(--u) * 13);
      letter-spacing: -0.02em;
      text-decoration: underline;
      text-underline-offset: 3px;
      opacity: 0.8;
      -webkit-tap-highlight-color: transparent;
    }

    .copy {
      margin-top: calc(var(--u) * 22);
      text-align: center;
      font-size: calc(var(--u) * 11);
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0.6;
    }

    /* 들어올 때 글자가 아래에서 살짝 떠오르는 효과 */
    .rise {
      animation: rise 0.8s cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: calc(var(--d, 0) * 1s);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(calc(var(--u) * 18)); }
      to { opacity: 1; transform: none; }
    }

    @keyframes draw {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    /* 움직임 줄이기 설정을 켠 사람에게는 효과 없이 바로 보여줌 */
    @media (prefers-reduced-motion: reduce) {
      .rise,
      .path {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <p class="brand">코카-콜라 X 신흥시장 · 해방촌</p>

    <h1 class="title rise" style="--d:0.05">
      신흥시장에서<br>
      해방촌까지,<br>
      한 골목에서 2년
    </h1>
    <p><span class="with rise" style="--d:0.2">with 코카-콜라</span></p>

    <div class="path" aria-hidden="true"></div>

    <dl class="credits rise" style="--d:1.3">
      <dt>주최·주관</dt>
      <dd>한국 코카-콜라</dd>
      <dt>협력</dt>
      <dd>신흥시장 상인회 · 해방촌 상인회</dd>
    </dl>

    <a class="home rise" style="--d:1.45" href="index.html">
      <span>처음으로</span>
      <span class="arrow" aria-hidden="true">↺</span>
    </a>

    <a class="back rise" style="--d:1.55" href="map-haebangchon.html">해방촌 지도로 돌아가기</a>

    <p class="copy rise" style="--d:1.65">© 2026 The Coca-Cola Company. All rights reserved.</p>

  </main>

  <!-- 오른쪽으로 밀면 마지막 가게(벽화)로 돌아감 -->
  <script src="shops/swipe.js" data-prev="shops-haebangchon/shop-09.html"></script>
</body>
</html>
