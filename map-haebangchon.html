<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>COCA-COLA × 해방촌</title>

  <!-- 링크 공유 미리보기 (카톡 등) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="COCA-COLA × 해방촌">
  <meta property="og:description" content="신흥시장에서 해방촌까지 with 코카-콜라">
  <meta property="og:image" content="https://2026cckc.github.io/cckc/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 지도 이미지 비율: 1166 x 2480 */
      --ratio: 0.4702;
      /* 화면 폭 (컴퓨터에서는 폰 화면 폭으로 제한) */
      --cw: min(100vw, 540px);
      /* 지도 폭: 화면 폭을 빈틈없이 채우고, 화면보다 짧아지지 않게 */
      --mw: max(var(--cw), 100vh * var(--ratio));
    }

    @supports (height: 100svh) {
      :root {
        --mw: max(var(--cw), 100svh * var(--ratio));
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--red);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 화면 한 장 크기의 틀 */
    .page {
      position: relative;
      width: var(--cw);
      height: 100vh;
      height: 100svh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg);
    }

    /* 지도가 화면보다 길면 위아래로 밀어서 볼 수 있음 (스크롤 막대는 숨김) */
    .scroller {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .scroller::-webkit-scrollbar {
      display: none;
    }

    /* 지도: 화면 폭을 빈틈없이 채우고, 화면보다 짧아지지 않게 맞춤 */
    .map-stage {
      position: relative;
      /* 가운데 정렬 (transform을 쓰면 핀이 위쪽 흐림 띠 아래로 깔려서 여백으로 맞춤) */
      margin-left: calc((var(--cw) - var(--mw)) / 2);
      width: var(--mw);
      aspect-ratio: 1166 / 2480;
      /* 가게 이름 글자 크기 기준 */
      font-size: calc(var(--mw) * 0.027);
    }

    .map-image {
      display: block;
      width: 100%;
      height: 100%;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* 위쪽 글자가 지도와 겹쳐도 잘 보이게 살짝 흐려지는 띠 */
    .page::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0 0 auto;
      height: calc(env(safe-area-inset-top, 0px) + 118px);
      background: linear-gradient(var(--bg) 45%, rgba(243, 242, 236, 0));
      pointer-events: none;
    }

    /* 왼쪽 위 제목 */
    .head {
      position: absolute;
      z-index: 5;
      top: calc(env(safe-area-inset-top, 0px) + 18px);
      left: 18px;
      right: 70px;
      pointer-events: none;
    }

    .brand {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .headline {
      margin: 8px 0 0;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.045em;
    }

    /* 오른쪽 위 메뉴 버튼 */
    .menu-btn {
      position: absolute;
      z-index: 8;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      right: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      width: 40px;
      height: 40px;
      padding: 0 11px;
      border: 0;
      background: var(--red);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-btn span {
      display: block;
      height: 2px;
      background: var(--bg);
      transition: transform 0.25s ease, opacity 0.2s ease;
    }

    /* 열렸을 때 X 모양 */
    .menu-btn[aria-expanded="true"] span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-btn[aria-expanded="true"] span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn[aria-expanded="true"] span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .menu-btn:focus-visible,
    .menu a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }

    /* 메뉴 목록 */
    .menu {
      position: absolute;
      z-index: 8;
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      right: 14px;
      width: 230px;
      margin: 0;
      padding: 0;
      list-style: none;
      background: var(--red);
      color: var(--bg);
      box-shadow: 0 10px 28px rgba(225, 4, 27, 0.28);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    .menu.open {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .menu li + li {
      border-top: 1px solid rgba(243, 242, 236, 0.25);
    }

    .menu a,
    .menu .here {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 16px;
      color: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .menu a small,
    .menu .here small {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.7;
    }

    .menu .here {
      opacity: 0.55;
    }

    /* 숫자 핀: 좌표는 핀의 뾰족한 끝 기준 */
    .pin {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 6.8%;
      aspect-ratio: 54 / 70;
      transform: translate(-50%, -100%);
      transform-origin: 50% 100%;
      transition: transform 0.12s ease;
      display: block;
      z-index: 3;
      color: var(--red);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .pin svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pin-number {
      fill: #FFFFFF;
      font-family: "Pretendard", Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .pin:active {
      transform: translate(-50%, -100%) scale(0.95);
    }

    @media (hover: hover) {
      .pin:hover {
        transform: translate(-50%, -100%) scale(1.08);
      }
    }

    .pin:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }

    /* 핀 옆 가게 이름 (r = 오른쪽, l = 왼쪽, t = 위) */
    .pin .name {
      position: absolute;
      top: 38%;
      padding: 0.15em 0.4em;
      background: var(--bg);
      color: var(--red);
      font-size: 1em;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.03em;
      white-space: nowrap;
      text-align: left;
      transform: translateY(-50%);
    }

    .pin .name.r {
      left: calc(100% + 0.15em);
    }

    .pin .name.l {
      right: calc(100% + 0.15em);
    }

    .pin .name.t {
      top: auto;
      bottom: calc(100% + 0.25em);
      left: 50%;
      transform: translateX(-50%);
    }

    /* 작은 원 옆 가게 이름 (핀 이름표보다 조금 작게) */
    .dot .dname {
      position: absolute;
      top: 50%;
      padding: 0.12em 0.38em;
      background: var(--bg);
      color: var(--red);
      font-size: 0.9em;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.03em;
      white-space: nowrap;
      transform: translateY(calc(-50% + var(--dy, 0em)));
    }

    .dot .dname.r {
      left: calc(100% + 0.3em);
    }

    .dot .dname.l {
      right: calc(100% + 0.3em);
    }

    .dot .dname.t {
      top: auto;
      bottom: calc(100% + 0.3em);
      left: 50%;
      transform: translateX(-50%);
    }

    /* 가게 이름을 조금 떨어뜨려 쓸 때 원과 이름을 잇는 얇은 선 */
    .dot .lead {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--len);
      height: 1.5px;
      background: var(--red);
      transform-origin: 0 50%;
      transform: rotate(var(--ang));
    }

    .dot .dname.at {
      left: calc(50% + var(--ex));
      top: calc(50% + var(--ey));
      right: auto;
      bottom: auto;
    }

    .dot .dname.at.l {
      transform: translate(calc(-100% - 0.2em), -50%);
    }

    .dot .dname.at.r {
      transform: translate(0.2em, -50%);
    }

    /* 작은 원: 좌표는 원의 중심 기준 (클릭 안 됨) */
    .dot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 2.4%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
    }
    /* 맨 아래 고정 안내문 (작게) */
    .footnote {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0;
      padding: 22px 18px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: linear-gradient(rgba(243, 242, 236, 0), var(--bg) 45%);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: -0.02em;
      pointer-events: none;
    }

    /* 아래쪽 안내: 잠깐 보였다가 사라짐 */
    .guide {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 58px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--red);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(225, 4, 27, 0.25);
      transform: translate(-50%, 12px);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .guide.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .guide svg {
      width: 12px;
      height: 15px;
      flex: none;
    }
  </style>
</head>

<body>

  <script>
    // 처음 열 때 핀들이 있는 곳이 화면에 오도록 지도 위치 맞추기
    (function () {
      var box = document.getElementById("scroller");
      function place() {
        var focus = parseFloat(box.getAttribute("data-focus")) || 0.5;
        box.scrollTop = focus * box.scrollHeight - box.clientHeight / 2;
      }
      place();
      window.addEventListener("load", place);

      // 안내 문구: 열자마자 보여주고, 5초 뒤나 화면을 만지면 사라짐
      var guide = document.getElementById("guide");
      function hide() { guide.classList.remove("show"); }
      setTimeout(function () { guide.classList.add("show"); }, 500);
      setTimeout(hide, 5500);
      // (처음 위치 맞출 때 생기는 움직임은 빼고, 사람이 직접 밀었을 때만)
      setTimeout(function () {
        box.addEventListener("scroll", function () { setTimeout(hide, 800); }, { once: true, passive: true });
      }, 1500);
    })();

    // 메뉴 여닫기 (바깥을 누르거나 Esc를 누르면 닫힘)
    (function () {
      var btn = document.getElementById("menu-btn");
      var menu = document.getElementById("menu");
      function set(open) {
        menu.classList.toggle("open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      }
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        set(!menu.classList.contains("open"));
      });
      document.addEventListener("click", function (e) {
        if (!menu.contains(e.target)) set(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") set(false);
      });
    })();
  </script>
</body>
</html>
