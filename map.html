
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>COCA-COLA × 신흥시장</title>

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      padding:
        env(safe-area-inset-top, 0px)
        14px
        env(safe-area-inset-bottom, 0px);
    }

    header {
      flex: 0 0 auto;
      padding: 13px 0 10px;
    }

    .title {
      margin: 0;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    @media (min-width: 700px) {
      .page {
        max-width: 760px;
        margin: 0 auto;
        padding-left: 24px;
        padding-right: 24px;
      }

      header {
        padding-top: 18px;
        padding-bottom: 14px;
      }

      .title {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1 class="title">COCA-COLA × 신흥시장</h1>
    </header>

    <main>
      <div class="map">
        <img
          src="sinheung-map.png"
          alt="신흥시장 코카콜라 참여 매장 지도"
        >
      </div>
    </main>
  </div>
</body>
</html>
