
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COCA-COLA × 신흥시장</title>

  <style>
    :root {
      --red: #E1041B;
      --cream: #F3F2EC;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .map-stage {
      position: relative;
      width: min(100vw, 46.17svh);
      aspect-ratio: 831 / 1800;
      overflow: hidden;
      background: var(--cream);
    }

    .map-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* 제목: 원래 지도 이미지에 제목이 있다면 별도 제목을 표시하지 않음 */
    .map-title {
      display: none;
    }

    /* 숫자 핀: 기존 뾰족한 모양을 유지하면서 가로 폭만 좁게 */
    .pin {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 7.2%;
      aspect-ratio: 48 / 76;
      transform: translate(-50%, -100%);
      display: block;
      z-index: 3;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .pin svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pin-shape {
      fill: var(--red);
    }

    .pin-number {
      fill: #FFFFFF;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 25px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -1px;
    }

    .pin:active {
      transform: translate(-50%, -100%) scale(0.96);
    }

    /* 작은 빨간 원: 좌표는 원의 중심 기준 */
    .dot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 2.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      transform: translate(-50%, -50%);
      z-index: 2;
    }
  </style>
</head>
