
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COCA-COLA × 신흥시장</title>

  <style>
    :root {
      --red: #E1041B;
      --cream: #F3F2EC;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .map-stage {
      position: relative;
      width: min(100vw, 46.17svh);
      aspect-ratio: 831 / 1800;
      overflow: hidden;
      background: var(--cream);
    }

    .map-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .map-title {
      position: absolute;
      top: 3.2%;
      left: 4.7%;
      z-index: 2;
      margin: 0;
      color: var(--red);
      font-size: clamp(12px, 3.5vw, 28px);
      font-weight: 800;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    /* 숫자 핀 */
    .pin {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 7.5%;
      aspect-ratio: 1;
      transform: translate(-50%, -65%);
      border: 0;
      border-radius: 50% 50% 50% 0;
      background: var(--red);
      color: white;
      text-decoration: none;
      font-size: clamp(10px, 3.2vw, 25px);
      font-weight: 800;
      letter-spacing: -0.04em;
      rotate: -45deg;
      -webkit-tap-highlight-color: transparent;
    }

    .pin span {
      display: block;
      transform: rotate(45deg);
    }

    .pin:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    /* 다른 상점 위치: 작은 빨간 원 */
    .dot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 2;
      width: 2.1%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--red);
    }

    @media (min-width: 700px) {
      .map-stage {
        width: min(100vw, 46.17svh, 500px);
      }
    }
  </style>
</head>

<body>
  <main class="map-stage">

    <!-- GitHub에 업로드한 길 표시 지도 -->
    <img
      class="map-image"
      src="sinheung-map.png"
      alt="COCA-COLA × 신흥시장 지도"
    >

    <h1 class="map-title">COCA-COLA × 신흥시장</h1>

    <!-- 숫자 핀 01–10 -->
    <a class="pin" href="shops/shop-01.html"
       style="--x:40.3%; --y:53.3%;" aria-label="상점 01">
      <span>01</span>
    </a>

    <a class="pin" href="shops/shop-02.html"
       style="--x:28.9%; --y:54.0%;" aria-label="상점 02">
      <span>02</span>
    </a>

    <a class="pin" href="shops/shop-03.html"
       style="--x:49.1%; --y:68.1%;" aria-label="상점 03">
      <span>03</span>
    </a>

    <a class="pin" href="shops/shop-04.html"
       style="--x:63.2%; --y:81.6%;" aria-label="상점 04">
      <span>04</span>
    </a>

    <a class="pin" href="shops/shop-05.html"
       style="--x:57.3%; --y:68.6%;" aria-label="상점 05">
      <span>05</span>
    </a>

    <a class="pin" href="shops/shop-06.html"
       style="--x:76.9%; --y:56.7%;" aria-label="상점 06">
      <span>06</span>
    </a>

    <a class="pin" href="shops/shop-07.html"
       style="--x:78.2%; --y:46.7%;" aria-label="상점 07">
      <span>07</span>
    </a>

    <a class="pin" href="shops/shop-08.html"
       style="--x:30.6%; --y:48.2%;" aria-label="상점 08">
      <span>08</span>
    </a>

    <a class="pin" href="shops/shop-09.html"
       style="--x:48.9%; --y:43.8%;" aria-label="상점 09">
      <span>09</span>
    </a>

    <a class="pin" href="shops/shop-10.html"
       style="--x:36.9%; --y:45.7%;" aria-label="상점 10">
      <span>10</span>
    </a>

    <!-- 기타 상점 위치: 수정된 작은 원 5개 -->
    <span class="dot"
          style="--x:56.7%; --y:28.7%;"
          aria-hidden="true"></span>

    <span class="dot"
          style="--x:57.2%; --y:36.7%;"
          aria-hidden="true"></span>

    <span class="dot"
          style="--x:31.5%; --y:57.3%;"
          aria-hidden="true"></span>

    <span class="dot"
          style="--x:39.4%; --y:63.7%;"
          aria-hidden="true"></span>

    <span class="dot"
          style="--x:69.9%; --y:58.2%;"
          aria-hidden="true"></span>

  </main>
</body>
</html>
