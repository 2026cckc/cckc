
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>COCA-COLA × 신흥시장</title>

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--bg);
    }

    /* 지도 전체 화면 */
    .map {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    /* 지도 위에 겹쳐지는 제목 */
    .title {
      position: absolute;
      z-index: 2;
      top: calc(env(safe-area-inset-top, 0px) + 18px);
      left: 16px;
      margin: 0;
      padding: 7px 10px;
      background: var(--bg);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.2px;
    }

    @media (min-width: 700px) {
      .title {
        top: 24px;
        left: 24px;
        font-size: 15px;
        padding: 9px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="map">
      <img
        src="sinheung-map.png"
        alt="신흥시장 코카콜라 참여 매장 지도"
      >
    </div>

    <h1 class="title">COCA-COLA × 신흥시장</h1>

  </div>
</body>
</html>
