
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COCA-COLA × 신흥시장</title>

  <style>
    :root {
      --red: #E1041B;
      --cream: #F3F2EC;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .map-stage {
      position: relative;
      width: min(100vw, 46.97svh);
      aspect-ratio: 962 / 2048;
      overflow: hidden;
      background: var(--cream);
    }

    .map-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .map-title {
      position: absolute;
      top: 3.1%;
      left: 4.7%;
      z-index: 2;
      margin: 0;
      color: var(--red);
      font-size: clamp(12px, 3.5vw, 28px);
      font-weight: 800;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    /* 숫자가 들어간 뾰족한 지도 핀 */
    .pin {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 8.2%;
      aspect-ratio: 60 / 76;
      transform: translate(-50%, -100%);
      display: block;
      z-index: 3;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .pin svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pin-shape {
      fill: var(--red);
    }

    .pin-number {
      fill: #FFFFFF;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 25px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -1px;
    }

    .pin:active {
      transform: translate(-50%, -100%) scale(0.96);
    }

    /* 작은 원: 좌표가 원의 아래쪽 끝에 맞춰짐 */
    .dot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 2.1%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      transform: translate(-50%, -100%);
      z-index: 2;
    }

    @media (min-width: 700px) {
      .map-stage {
        width: min(100vw, 46.97svh, 500px);
      }
    }
  </style>
</head>
