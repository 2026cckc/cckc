
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>COCA-COLA × 신흥시장</title>

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--bg);
    }

    .map {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-stage {
      position: relative;
      width: min(100vw, 46.17svh);
      aspect-ratio: 831 / 1800;
      flex: none;
    }

    .map-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* 제목 디자인 유지 */
    .title {
      position: absolute;
      z-index: 5;
      top: calc(env(safe-area-inset-top, 0px) + 18px);
      left: 16px;
      margin: 0;
      padding: 7px 10px;
      background: var(--bg);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.2px;
    }

    @media (min-width: 700px) {
      .title {
        top: 24px;
        left: 24px;
        font-size: 15px;
        padding: 9px 12px;
      }

      .map-stage {
        width: min(100vw, 46.17svh, 500px);
      }
    }

    /* 숫자 핀: 가로 폭을 줄이고 세로 길이도 조금 짧게 */
    .pin {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 7.4%;
      aspect-ratio: 54 / 68;
      transform: translate(-50%, -100%);
      display: block;
      z-index: 3;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .pin svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pin-shape {
      fill: var(--red);
    }

    .pin-number {
      fill: #FFFFFF;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 25px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -1px;
    }

    .pin:active {
      transform: translate(-50%, -100%) scale(0.97);
    }

    /* 작은 원: 좌표는 원의 중심 기준 */
    .dot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 2.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      transform: translate(-50%, -50%);
      z-index: 2;
    }
  </style>
</head>
