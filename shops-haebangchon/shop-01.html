<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>성광대도 | COCA-COLA × 해방촌</title>

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 디자인 시안(가로 920px)의 1px. 화면 폭에 맞춰 자동으로 커지고 작아짐 */
      --u: calc(min(100vw, 540px) / 920);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--red);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    /* 페이지 길이를 시안에 맞춰서, 맨 아래 번호가 항상 같은 위치에 오게 함 */
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(100vw, 540px);
      min-height: calc(var(--u) * 1840);
      margin: 0 auto;
      padding:
        calc(var(--u) * 95 + env(safe-area-inset-top, 0px))
        calc(var(--u) * 88)
        calc(var(--u) * 136 + env(safe-area-inset-bottom, 0px))
        calc(var(--u) * 87);
    }

    p,
    h1 {
      margin: 0;
    }

    /* 오른쪽 정렬 표시 */
    .r {
      text-align: right;
    }

    /* 오른쪽 위 작은 글씨 (누르면 해방촌 지도로) */
    .brand {
      text-align: right;
      font-size: calc(var(--u) * 20);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .brand a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 빨간 박스 이름표 */
    .owner {
      width: fit-content;
      padding: calc(var(--u) * 4) calc(var(--u) * 8);
      background: var(--red);
      color: var(--bg);
      font-size: calc(var(--u) * 25);
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .owner.r {
      margin-left: auto;
    }

    /* 큰 가게 이름 */
    .name {
      font-size: calc(var(--u) * 130);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    /* 가게 이름 옆 작은 글씨, 예: (+모로코코) */
    .name small {
      font-size: calc(var(--u) * 30);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-left: calc(var(--u) * 6);
    }

    .subtitle {
      font-size: calc(var(--u) * 23);
      line-height: 1.5;
      letter-spacing: -0.03em;
    }

    .desc {
      font-size: calc(var(--u) * 22);
      line-height: 1.55;
      letter-spacing: -0.03em;
    }

    /* 인용문 */
    .quote {
      font-size: calc(var(--u) * 47);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    /* 왼쪽 정렬 인용문은 첫 따옴표만 앞으로 튀어나오게 */
    .quote:not(.r) {
      padding-left: calc(var(--u) * 18);
      text-indent: calc(var(--u) * -18);
    }

    /* 가게 사진 */
    .photo {
      display: block;
      object-fit: cover;
    }

    .photo.r {
      margin-left: auto;
    }

    /* 사진 옆에 글이 붙는 배치 */
    .row {
      display: flex;
      align-items: flex-end;
      gap: calc(var(--u) * 16);
    }

    .row .photo {
      flex: none;
    }

    /* 아래 번호 + 분류 (모든 페이지 같은 위치) */
    .footer {
      display: flex;
      gap: calc(var(--u) * 22);
      margin-top: auto;
      padding-top: calc(var(--u) * 90);
      font-size: calc(var(--u) * 19);
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 누르면 해방촌 지도로 돌아감 -->
    <p class="brand"><a href="../map-haebangchon.html">코카-콜라 X 해방촌</a></p>

    <img class="photo" src="shop-01.jpg" alt="성광대도 바 테이블 위 코카-콜라 램프"
         style="width: calc(var(--u) * 746); aspect-ratio: 746 / 497; margin-top: calc(var(--u) * 45);">

    <p class="quote" style="margin-top: calc(var(--u) * 28);">
      “직원으로 시작해 이제는 제가<br>
      직접 운영하는 가게가 됐어요.<br>
      그만큼 애정이 남다른 곳이라,<br>
      해방촌에서 오래도록 지켜가고 싶어요.”
    </p>

    <p class="owner r" style="margin-top: calc(var(--u) * 108);">김동석 사장</p>
    <h1 class="name r" style="margin-top: calc(var(--u) * 4);">성광대도</h1>
    <p class="subtitle r" style="margin-top: calc(var(--u) * 34);">해방촌의 작은 홍콩</p>

    <p class="desc r" style="margin-top: calc(var(--u) * 34);">
      홍콩의 정취를 느낄 수 있는 공간에서<br>
      다양한 중식 요리를 즐기는 해방촌의 10년 차 중식 요리주점<br>
      주방 직원으로 시작해 가게를 이어받은 사장님.<br>
      코카-콜라 네온사인부터 포스터와 조명까지,<br>
      가게 곳곳에 새로운 볼거리를 더하며<br>
      해방촌의 저녁 풍경을 한층 풍성하게 만들었다.
    </p>

    <p class="footer">
      <span>01</span>
      <span>홍콩풍 중식 요리주점</span>
    </p>

  </main>

  <!-- 좌우로 넘겨서 다른 가게로 이동 -->
  <script src="swipe.js"></script>
</body>
</html>
