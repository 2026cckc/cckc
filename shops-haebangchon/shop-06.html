<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>타코스탠드 | COCA-COLA × 해방촌</title>

  <!-- 링크 공유 미리보기 (카톡 등) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="타코스탠드 | COCA-COLA × 해방촌">
  <meta property="og:description" content="신흥시장에서 해방촌까지 with 코카-콜라">
  <meta property="og:image" content="https://2026cckc.github.io/cckc/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 디자인 시안(가로 920px)의 1px. 화면 폭에 맞춰 자동으로 커지고 작아짐 */
      --u: calc(min(100vw, 540px) / 920);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--red);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    /* 페이지 길이를 시안에 맞춰서, 맨 아래 번호가 항상 같은 위치에 오게 함 */
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(100vw, 540px);
      min-height: calc(var(--u) * 1788);
      margin: 0 auto;
      padding:
        calc(var(--u) * 43 + env(safe-area-inset-top, 0px))
        calc(var(--u) * 88)
        calc(var(--u) * 136 + env(safe-area-inset-bottom, 0px))
        calc(var(--u) * 87);
    }

    p,
    h1 {
      margin: 0;
    }

    /* 오른쪽 정렬 표시 */
    .r {
      text-align: right;
    }

    /* 오른쪽 위 작은 글씨 (누르면 해방촌 지도로) */
    .brand {
      text-align: right;
      font-size: calc(var(--u) * 20);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .brand a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 빨간 박스 이름표 */
    .owner {
      width: fit-content;
      padding: calc(var(--u) * 4) calc(var(--u) * 8);
      background: var(--red);
      color: var(--bg);
      font-size: calc(var(--u) * 25);
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .owner.r {
      margin-left: auto;
    }

    /* 큰 가게 이름 */
    .name {
      font-size: calc(var(--u) * 130);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    /* 가게 이름 옆 작은 글씨, 예: (+모로코코) */
    .name small {
      font-size: calc(var(--u) * 30);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-left: calc(var(--u) * 6);
    }

    .subtitle {
      font-size: calc(var(--u) * 23);
      line-height: 1.5;
      letter-spacing: -0.03em;
    }

    .desc {
      font-size: calc(var(--u) * 22);
      line-height: 1.55;
      letter-spacing: -0.03em;
    }

    /* 인용문 */
    .quote {
      font-size: calc(var(--u) * 47);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    /* 왼쪽 정렬 인용문은 첫 따옴표만 앞으로 튀어나오게 */
    .quote:not(.r) {
      padding-left: calc(var(--u) * 18);
      text-indent: calc(var(--u) * -18);
    }

    /* 가게 사진 */
    .photo {
      display: block;
      object-fit: cover;
    }

    .photo.r {
      margin-left: auto;
    }

    /* 사진 옆에 글이 붙는 배치 */
    .row {
      display: flex;
      align-items: flex-end;
      gap: calc(var(--u) * 16);
    }

    .row .photo {
      flex: none;
    }

    /* 아래 번호 + 분류 (모든 페이지 같은 위치) */
    .footer {
      display: flex;
      gap: calc(var(--u) * 22);
      margin-top: auto;
      padding-top: calc(var(--u) * 90);
      font-size: calc(var(--u) * 19);
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 누르면 해방촌 지도로 돌아감 -->
    <p class="brand"><a href="../map-haebangchon.html">코카-콜라 X 해방촌</a></p>

    <p class="quote" style="margin-top: calc(var(--u) * 33);">
      “저희 크루는 단순히<br>
      일만 같이하는 사이가 아니에요.<br>
      저마다 개성은 다르지만<br>
      같은 꿈을 꾸는, 조금은 별난 가족 같죠.<br>
      앞으로도 오래오래 함께하고 싶어요.”
    </p>

    <img class="photo" src="shop-06.jpg" alt="타코스탠드 매장 내부"
         style="width: calc(var(--u) * 663); aspect-ratio: 663 / 443; margin-top: calc(var(--u) * 43);">

    <p class="owner r" style="margin-top: calc(var(--u) * 112);">차규헌 사장</p>
    <h1 class="name r" style="margin-top: calc(var(--u) * 8);">타코스탠드</h1>
    <p class="subtitle r" style="margin-top: calc(var(--u) * 54);">해방촌에서 만나는 멕시코</p>

    <p class="desc r" style="margin-top: calc(var(--u) * 34);">
      매년 멕시코 곳곳을 여행하며<br>
      발견한 다채로운 지역의 맛을 한자리에 모은 멕시칸 타코 전문점<br>
      12년을 함께한 크루들과 좋아하는 일을 즐겁게, 오래 이어가는 방법을 고민해왔다.<br>
      이번 코카-콜라 협업에서는 멕시코 문화에 대한 애정을 더욱 가득히 담아냈다.
    </p>

    <p class="footer">
      <span>06</span>
      <span>멕시칸 타코 전문점</span>
    </p>

  </main>

  <!-- 좌우로 넘겨서 다른 가게로 이동 -->
  <script src="swipe.js"></script>
</body>
</html>
