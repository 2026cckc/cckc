
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F2EC">
  <title>01 — H5NG</title>

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
    }

    /* 1080 × 1920 디자인 캔버스 */

    .page {
      position: relative;
      width: min(100%, calc(100svh * 1080 / 1920));
      aspect-ratio: 1080 / 1920;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--bg);
    }

    /* 홍석우 사장 */

    .name-label {
      position: absolute;
      left: 10.2%;
      top: 5.45%;
      margin: 0;
      padding: 0.25em 0.2em 0.3em;
      background: var(--red);
      color: var(--bg);
      font-size: 2.55cqw;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    /* H5NG */

    .shop-name {
      position: absolute;
      top: 7.55%;
      left: 9.1%;
      margin: 0;
      color: var(--red);
      font-size: 17.7cqw;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.085em;
    }

    /* 소개 문구 */

    .intro {
      position: absolute;
      top: 15.55%;
      left: 9.5%;
      width: 80%;
      margin: 0;
      font-size: 2.45cqw;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    /* 매장 사진 */

    .shop-photo {
      position: absolute;
      top: 22.65%;
      left: 27.8%;
      width: 62.2%;
      height: 40.3%;
      margin: 0;
      overflow: hidden;
    }

    .shop-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* 인용문 */

    .quote {
      position: absolute;
      top: 64.1%;
      right: 10.1%;
      width: 52%;
      margin: 0;
      font-size: 5.2cqw;
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: -0.075em;
      text-align: right;
      word-break: keep-all;
    }

    /* 하단 매장 분류 */

    .footer-label {
      position: absolute;
      top: 80.1%;
      left: 10.2%;
      display: flex;
      gap: 2.5cqw;
      align-items: baseline;
      margin: 0;
      font-size: 2.25cqw;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.045em;
    }

    .footer-number {
      flex-shrink: 0;
    }

    /* 텍스트 복사 가능 */

    .page,
    .page * {
      user-select: text;
      -webkit-user-select: text;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px 0;
      }

      .page {
        width: min(100%, 540px, calc(100svh * 1080 / 1920));
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <p class="name-label">홍석우 사장</p>

    <h1 class="shop-name">H5NG</h1>

    <p class="intro">
      3대가 지켜온 자리에서 신흥시장에 새로운 감각을 더하는<br>
      아메리칸 차이니즈 레스토랑.<br>
      해방촌에서 나고 자라, 3대째 가족이 지켜온 자리에서 가게를 이어간다.
    </p>

    <figure class="shop-photo">
      <img src="01.png" alt="H5NG 홍석우 사장">
    </figure>

    <p class="quote">
      "시장이 살아나야<br>
      동네도 살아납니다."
    </p>

    <p class="footer-label">
      <span class="footer-number">01</span>
      <span>아메리칸 차이니즈</span>
    </p>

  </main>
</body>
</html>
