
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3F2EC">

  <title>01 — H5NG</title>

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--red);
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 1080 × 1920 비율의 디자인 캔버스 */
    .page {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 1080 / 1920;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg);
      container-type: inline-size;
    }

    /* 이름표 */
    .name-label {
      position: absolute;
      top: 5%;
      left: 10.35%;
      margin: 0;
      padding: 0.22em 0.18em 0.28em;
      background: var(--red);
      color: var(--bg);
      font-size: 2.55cqw;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    /* 메인 타이틀 */
    .shop-name {
      position: absolute;
      top: 8%;
      left: 9.4%;
      margin: 0;
      font-size: 17.7cqw;
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.085em;
      white-space: nowrap;
    }

    /* 소개 문구 */
    .intro {
      position: absolute;
      top: 18%;
      left: 9.5%;
      width: 81%;
      margin: 0;
      font-size: 2.45cqw;
      font-weight: 700;
      line-height: 1.8;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    /* 사진 */
    .shop-photo {
      position: absolute;
      top: 30%;
      left: 23%;
      width: 67%;
      height: 36%;
      margin: 0;
      overflow: hidden;
    }

    .shop-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    /* 인용문 */
    .quote {
      position: absolute;
      top: 66%;
      right: 10.1%;
      width: 70%;
      margin: 0;
      font-size: 5.2cqw;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.075em;
      text-align: right;
      word-break: keep-all;
    }

    /* 하단 라벨 */
    .footer-label {
      position: absolute;
      top: 76%;
      left: 10.2%;
      display: flex;
      align-items: baseline;
      gap: 2.5cqw;
      margin: 0;
      font-size: 2.25cqw;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    .page,
    .page * {
      user-select: text;
      -webkit-user-select: text;
    }

    /* PC에서는 콘텐츠만 가운데 배치 */
    @media (min-width: 700px) {
      .page {
        width: min(100%, 540px);
      }
    }
  </style>
</head>

<body>
  <main class="page" id="shop-01">

    <p class="name-label">홍석우 사장</p>

    <h1 class="shop-name">H5NG</h1>

    <p class="intro">
      3대가 지켜온 자리에서 신흥시장에 새로운 감각을 더하는<br>
      아메리칸 차이니즈 레스토랑.<br>
      해방촌에서 나고 자라, 3대째 가족이 지켜온 자리에서 가게를 이어간다.
    </p>

    <figure class="shop-photo">
      <img src="01.png" alt="H5NG 매장 사진">
    </figure>

    <p class="quote">
      "시장이 살아나야<br>
      동네도 살아납니다."
    </p>

    <p class="footer-label">
      <span>01</span>
      <span>아메리칸 차이니즈</span>
    </p>

  </main>
</body>
</html>
