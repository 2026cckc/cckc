
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3F2EC">
  <title>01 — H5NG</title>

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      color: var(--red);
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 전체 디자인 캔버스 */
    .page {
      position: relative;
      width: min(100vw, 56.25svh);
      aspect-ratio: 1080 / 1920;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg);

      /* cqw가 캔버스 너비를 기준으로 계산되게 설정 */
      container-type: inline-size;
    }

    /* 이름 라벨 */
    .name-label {
      position: absolute;
      left: 10.35%;
      top: 5.45%;
      margin: 0;
      padding: 0.22em 0.18em 0.28em;
      background: var(--red);
      color: var(--bg);
      font-size: 2.55cqw;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    /* H5NG */
    .shop-name {
      position: absolute;
      left: 9.4%;
      top: 7.7%;
      margin: 0;
      font-size: 17.7cqw;
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.085em;
      white-space: nowrap;
    }

    /* 소개 문구 */
    .intro {
      position: absolute;
      left: 9.5%;
      top: 15.55%;
      width: 81%;
      margin: 0;
      font-size: 2.45cqw;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    /* 메인 사진 */
    .shop-photo {
      position: absolute;
      left: 27.8%;
      top: 22.65%;
      width: 62.2%;
      height: 40.3%;
      margin: 0;
    }

    .shop-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* 인용문 */
    .quote {
      position: absolute;
      top: 64.1%;
      right: 10.1%;
      width: 52%;
      margin: 0;
      font-size: 5.2cqw;
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: -0.075em;
      text-align: right;
      word-break: keep-all;
    }

    /* 하단 카테고리 */
    .footer-label {
      position: absolute;
      top: 80.1%;
      left: 10.2%;
      display: flex;
      align-items: baseline;
      gap: 2.5cqw;
      margin: 0;
      font-size: 2.25cqw;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    /* 글자는 선택 및 복사 가능 */
    .page,
    .page * {
      user-select: text;
      -webkit-user-select: text;
    }

    /* 큰 화면에서는 캔버스만 적당히 축소 */
    @media (min-width: 700px) {
      .page {
        width: min(56.25vw, 56.25svh, 540px);
      }
    }
  </style>
</head>

<body>
  <main class="page" id="shop-01">

    <p class="name-label">홍석우 사장</p>

    <h1 class="shop-name">H5NG</h1>

    <p class="intro">
      3대가 지켜온 자리에서 신흥시장에 새로운 감각을 더하는<br>
      아메리칸 차이니즈 레스토랑.<br>
      해방촌에서 나고 자라, 3대째 가족이 지켜온 자리에서 가게를 이어간다.
    </p>

    <figure class="shop-photo">
      <img src="01.png" alt="H5NG 홍석우 사장">
    </figure>

    <p class="quote">
      "시장이 살아나야<br>
      동네도 살아납니다."
    </p>

    <p class="footer-label">
      <span>01</span>
      <span>아메리칸 차이니즈</span>
    </p>

  </main>
</body>
</html>
