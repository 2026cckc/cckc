
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCKC SHOP GUIDE</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F3F2EC;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    @media (min-width: 700px) {
      img {
        width: auto;
        height: 100vh;
        max-width: 100vw;
      }
    }
  </style>
</head>

<body>
  <img src="01.png" alt="CCKC Shop Guide">
</body>
</html>
