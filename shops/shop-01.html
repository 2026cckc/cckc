<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>H5NG | COCA-COLA × 신흥시장</title>

  <!-- 링크 공유 미리보기 (카톡 등) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="H5NG | COCA-COLA × 신흥시장">
  <meta property="og:description" content="신흥시장에서 해방촌까지 with 코카-콜라">
  <meta property="og:image" content="https://2026cckc.github.io/cckc/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 디자인 시안(가로 1080px)의 1px. 화면 폭에 맞춰 자동으로 커지고 작아짐 */
      --u: calc(min(100vw, 540px) / 1080);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--red);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    .page {
      position: relative;
      width: min(100vw, 540px);
      margin: 0 auto;
      padding:
        calc(var(--u) * 50 + env(safe-area-inset-top, 0px))
        calc(var(--u) * 105)
        calc(var(--u) * 160 + env(safe-area-inset-bottom, 0px))
        calc(var(--u) * 102);
    }

    /* 오른쪽 위 작은 글씨 */
    .brand {
      margin: 0 0 calc(var(--u) * 6);
      text-align: right;
      font-size: calc(var(--u) * 24);
      letter-spacing: -0.02em;
    }

    .brand a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 빨간 박스 이름표 */
    .owner {
      display: inline-block;
      margin: 0;
      padding: calc(var(--u) * 5) calc(var(--u) * 9);
      background: var(--red);
      color: var(--bg);
      font-size: calc(var(--u) * 30);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    /* 큰 가게 이름 */
    .name {
      margin: calc(var(--u) * 6) 0 0 calc(var(--u) * -4);
      font-family: Arial, Helvetica, sans-serif;
      font-size: calc(var(--u) * 178);
      font-weight: 700;
      line-height: 0.82;
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: calc(var(--u) * 40) 0 0;
      font-size: calc(var(--u) * 27);
      letter-spacing: -0.03em;
    }

    .desc {
      margin: calc(var(--u) * 50) 0 0;
      font-size: calc(var(--u) * 26);
      line-height: 1.55;
      letter-spacing: -0.03em;
    }

    /* 가게 사진 (오른쪽 정렬) */
    .photo {
      display: block;
      width: calc(var(--u) * 668);
      aspect-ratio: 668 / 898;
      margin: calc(var(--u) * 85) 0 0 auto;
      object-fit: cover;
    }

    /* 인용문 */
    .quote {
      margin: calc(var(--u) * 12) 0 0;
      text-align: right;
      font-size: calc(var(--u) * 57);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    /* 아래 번호 + 분류 */
    .footer {
      display: flex;
      gap: calc(var(--u) * 26);
      margin: calc(var(--u) * 205) 0 0;
      font-size: calc(var(--u) * 22);
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 누르면 신흥시장 지도로 돌아감 -->
    <p class="brand"><a href="../map-sinheung.html">코카-콜라 X 신흥시장</a></p>

    <p class="owner">홍석우 사장</p>
    <h1 class="name">H5NG</h1>

    <p class="subtitle">3대가 지켜온 자리에서</p>

    <p class="desc">
      신흥시장에 새로운 감각을 더하는 아메리칸 차이니즈 레스토랑.<br>
      해방촌에서 나고 자라, 3대째 가족이 지켜온 자리에서 가게를 이어가고 있다.
    </p>

    <img class="photo" src="shop-01.jpg" alt="H5NG 주방에서 요리하는 홍석우 사장">

    <p class="quote">
      “가족의 뿌리가 있는,<br>
      가장 익숙한 이곳에서<br>
      ‘홍’이라는 이름을 걸고<br>
      새로운 도전을 하고 싶었어요.”
    </p>

    <p class="footer">
      <span>01</span>
      <span>아메리칸 차이니즈</span>
    </p>

  </main>

  <!-- 좌우로 넘겨서 다른 가게로 이동 -->
  <script src="swipe.js"></script>
</body>
</html>
