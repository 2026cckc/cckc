<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F2EC">
  <title>팁시타코 | COCA-COLA × 신흥시장</title>

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 디자인 시안(가로 1080px)의 1px. 화면 폭에 맞춰 자동으로 커지고 작아짐 */
      --u: calc(min(100vw, 540px) / 1080);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--red);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    /* 페이지 전체 높이를 시안 길이에 맞춰서, 맨 아래 번호가 항상 같은 위치에 오게 함 */
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(100vw, 540px);
      min-height: calc(var(--u) * 2158);
      margin: 0 auto;
      padding:
        calc(var(--u) * 110 + env(safe-area-inset-top, 0px))
        calc(var(--u) * 105)
        calc(var(--u) * 160 + env(safe-area-inset-bottom, 0px))
        calc(var(--u) * 102);
    }

    /* 오른쪽 위 작은 글씨 (1번과 동일) */
    .brand {
      margin: 0;
      text-align: right;
      font-size: calc(var(--u) * 24);
      letter-spacing: -0.02em;
    }

    .brand a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 가게 사진 (가로로 꽉 차게) */
    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 876 / 584;
      margin: calc(var(--u) * 50) 0 0;
      object-fit: cover;
    }

    /* 인용문 (왼쪽 정렬, 첫 따옴표만 앞으로 튀어나오게) */
    .quote {
      margin: calc(var(--u) * 50) 0 0;
      padding-left: calc(var(--u) * 20);
      text-indent: calc(var(--u) * -20);
      font-size: calc(var(--u) * 57);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    /* 여기부터 오른쪽 정렬 묶음 */
    .info {
      margin-top: calc(var(--u) * 140);
      text-align: right;
    }

    /* 빨간 박스 이름표 */
    .owner {
      display: inline-block;
      margin: 0;
      padding: calc(var(--u) * 5) calc(var(--u) * 9);
      background: var(--red);
      color: var(--bg);
      font-size: calc(var(--u) * 30);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    /* 큰 가게 이름 */
    .name {
      margin: calc(var(--u) * 4) 0 0;
      font-size: calc(var(--u) * 155);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: calc(var(--u) * 40) 0 0;
      font-size: calc(var(--u) * 27);
      letter-spacing: -0.03em;
    }

    .desc {
      margin: calc(var(--u) * 50) 0 0;
      font-size: calc(var(--u) * 26);
      line-height: 1.55;
      letter-spacing: -0.03em;
    }

    /* 아래 번호 + 분류 (1번과 같은 위치) */
    .footer {
      display: flex;
      gap: calc(var(--u) * 26);
      margin: auto 0 0;
      padding-top: calc(var(--u) * 120);
      font-size: calc(var(--u) * 22);
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 누르면 신흥시장 지도로 돌아감 -->
    <p class="brand"><a href="../map-sinheung.html">코카-콜라 X 신흥시장</a></p>

    <img class="photo" src="shop-02.jpg" alt="팁시타코 매장 창가에서 타코를 먹는 손님들">

    <p class="quote">
      “‘해방’이라는 단어가 있는 동네라,<br>
      저희 같은 자유로운 가게가<br>
      어울린다고 생각했어요.”
    </p>

    <div class="info">
      <p class="owner">유영섭 사장</p>
      <h1 class="name">팁시타코</h1>

      <p class="subtitle">골목을 밝히는 보틀 네온사인</p>

      <p class="desc">
        멕시칸의 매력에 한국인의 입맛을 더한 시그니처 타코를<br>
        선보이는 개성 넘치는 타코 전문점.<br>
        자신만의 개성이 담긴 타코를 선보이고자 신흥시장을 선택했고,<br>
        매장 위 보틀 네온사인은 골목의 대표 풍경으로 자리 잡았다.
      </p>
    </div>

    <p class="footer">
      <span>02</span>
      <span>멕시칸 타코 전문점</span>
    </p>

  </main>

  <!-- 좌우로 넘겨서 다른 가게로 이동 -->
  <script src="swipe.js"></script>
</body>
</html>
