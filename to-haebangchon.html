<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E1041B">
  <title>신흥시장 → 해방촌 | COCA-COLA</title>

  <!-- 링크 공유 미리보기 (카톡 등) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="신흥시장 → 해방촌 | COCA-COLA">
  <meta property="og:description" content="신흥시장에서 해방촌까지 with 코카-콜라">
  <meta property="og:image" content="https://2026cckc.github.io/cckc/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #F3F2EC;
      --red: #E1041B;
      /* 디자인 기준(가로 390px)의 1px. 메인 페이지와 같은 기준 */
      --u: calc(min(100vw, 540px) / 390);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--red);
    }

    body {
      color: var(--bg);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    p,
    h1 {
      margin: 0;
    }

    /* 화면 높이를 꽉 채우고, 버튼은 항상 맨 아래 */
    .page {
      display: flex;
      flex-direction: column;
      width: min(100vw, 540px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding:
        calc(var(--u) * 22 + env(safe-area-inset-top, 0px))
        calc(var(--u) * 24)
        calc(var(--u) * 44 + env(safe-area-inset-bottom, 0px))
        calc(var(--u) * 24);
    }

    /* 오른쪽 위 작은 글씨 (누르면 신흥시장 지도로) */
    .brand {
      text-align: right;
      font-size: calc(var(--u) * 12);
      letter-spacing: -0.02em;
    }

    .brand a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 신흥시장 → 해방촌 표시 */
    .route {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 6);
      margin-top: calc(var(--u) * 54);
      font-size: calc(var(--u) * 14);
      letter-spacing: -0.03em;
    }

    .route .from {
      opacity: 0.6;
    }

    .route .to {
      padding: calc(var(--u) * 4) calc(var(--u) * 8);
      background: var(--bg);
      color: var(--red);
      line-height: 1.15;
    }

    /* 큰 문구 */
    .headline {
      margin-top: calc(var(--u) * 12);
      font-size: calc(var(--u) * 44);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.05em;
    }

    /* 언덕을 따라 내려가는 길처럼, 문구에서 아래로 이어지는 선 */
    .path {
      flex: 1;
      min-height: calc(var(--u) * 60);
      margin: calc(var(--u) * 22) 0 calc(var(--u) * 22) calc(var(--u) * 2);
      width: calc(var(--u) * 3);
      background: var(--bg);
      transform-origin: top;
      animation: draw 1.4s 0.5s cubic-bezier(.6, 0, .2, 1) both;
    }

    .desc {
      font-size: calc(var(--u) * 14.5);
      line-height: 1.75;
      letter-spacing: -0.03em;
    }

    /* 해방촌 지도로 가는 버튼 */
    .next {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: calc(var(--u) * 32);
      padding: calc(var(--u) * 17) calc(var(--u) * 20);
      background: var(--bg);
      color: var(--red);
      font-size: calc(var(--u) * 17);
      letter-spacing: -0.03em;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .next .arrow {
      transition: transform 0.2s ease;
    }

    .next:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .next:hover .arrow {
        transform: translateX(calc(var(--u) * 6));
      }
    }

    .next:focus-visible {
      outline: 2px solid var(--bg);
      outline-offset: 4px;
    }

    /* 들어올 때 글자가 아래에서 살짝 떠오르는 효과 */
    .rise {
      animation: rise 0.8s cubic-bezier(.2, .7, .2, 1) both;
    }

    .route.rise { animation-delay: 0.05s; }
    .headline.rise { animation-delay: 0.15s; }
    .desc.rise { animation-delay: 1.2s; }
    .next.rise { animation-delay: 1.4s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(calc(var(--u) * 18)); }
      to { opacity: 1; transform: none; }
    }

    @keyframes draw {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    /* 움직임 줄이기 설정을 켠 사람에게는 효과 없이 바로 보여줌 */
    @media (prefers-reduced-motion: reduce) {
      .rise,
      .path {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 누르면 신흥시장 지도로 돌아감 -->
    <p class="brand"><a href="map-sinheung.html">코카-콜라 X 신흥시장 · 해방촌</a></p>

    <p class="route rise">
      <span class="from">신흥시장</span>
      <span aria-hidden="true">→</span>
      <span class="to">해방촌</span>
    </p>

    <h1 class="headline rise">
      시장 골목의<br>
      이야기는<br>
      언덕 아래 동네로<br>
      이어집니다
    </h1>

    <div class="path" aria-hidden="true"></div>

    <p class="desc rise">
      신흥시장에서 언덕을 따라 이어지는 신흥로.<br>
      서로 다른 취향과 이야기를 가진 가게들.<br>
      코카-콜라의 브랜드 자산을 각자의 개성에 맞게 더해,<br>
      해방촌 골목에 새로운 매력과 경험을 더합니다.
    </p>

    <!-- 해방촌 지도로 이동 -->
    <a class="next rise" href="map-haebangchon.html">
      <span>해방촌 지도 보기</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

  </main>

  <!-- 좌우로 넘기기: 오른쪽으로 밀면 10번 가게로, 왼쪽으로 밀면 해방촌 지도로 -->
  <script src="shops/swipe.js"
          data-prev="shops/shop-12.html"
          data-next="map-haebangchon.html"></script>
</body>
</html>
